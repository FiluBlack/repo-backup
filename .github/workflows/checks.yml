name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      # Cache the hook environments; the key changes when the config does.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every hook
        run: uv run pre-commit run --all-files --show-diff-on-failure

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      # The app must import and serve; the manifest reader must parse.
      - name: App responds
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get('/').status_code == 200
          assert c.get('/api/status').status_code == 200
          print('app ok')
          "

      - name: Manifest parses
        run: python3 tools/repos.py list repos.example.toml

      - name: Script passes its own syntax check
        run: bash -n repo-backup.sh
